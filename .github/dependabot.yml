version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
    # Major bumps (e.g. EF Core 9, which needs .NET 9) are deliberate upgrades,
    # not drive-by merges — they stay manual.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # Same deal here: React 19, Vite 8, router v7 etc. get evaluated one by one.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
